services:
  db:
    image: postgres:16-alpine
    container_name: feerecon-db
    environment:
      POSTGRES_USER: ${PGUSER:-feerecon}
      POSTGRES_PASSWORD: ${PGPASSWORD:-feerecon}
      POSTGRES_DB: ${PGDATABASE:-feerecon}
    ports:
      - "${PGPORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-feerecon} -d ${PGDATABASE:-feerecon}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
